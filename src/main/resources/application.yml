server:
  port: ${PORT:8080}

spring:
  application:
    name: distribuidora-back
  servlet:
    multipart:
      max-file-size: 18MB
      max-request-size: 20MB
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 180000
      connection-timeout: 30000
  jpa:
    hibernate:
      # El esquema del catálogo se gestiona con los scripts de docs/sql, no con Hibernate.
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    token-secret: ${ADMIN_TOKEN_SECRET:distribuidora-dev-secret-change-me}
    token-ttl-seconds: ${ADMIN_TOKEN_TTL_SECONDS:86400}
  gcs:
    bucket-name: ${GCS_BUCKET_NAME:}
    upload-prefix: ${GCS_UPLOAD_PREFIX:products}
    public-base-url: ${GCS_PUBLIC_BASE_URL:}
    cache-control: ${GCS_UPLOAD_CACHE_CONTROL:public, max-age=31536000, immutable}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:noreply@distribuidoraguayaquil.com}
    from-name: ${MAIL_FROM_NAME:Distribuidora Guayaquil}
  # Facturación electrónica (proxy a open-api-facturacion-sri)
  # SRI_API_URL, SRI_API_TOKEN, SRI_EMISOR_* — ver .env.example
  sri:
    api-url: ${SRI_API_URL:}
    api-token: ${SRI_API_TOKEN:}
    ambiente: ${SRI_AMBIENTE:1}
    emisor:
      ruc: ${SRI_EMISOR_RUC:}
      razon-social: ${SRI_EMISOR_RAZON_SOCIAL:}
      nombre-comercial: ${SRI_EMISOR_NOMBRE_COMERCIAL:}
      dir-matriz: ${SRI_EMISOR_DIR_MATRIZ:}
      dir-establecimiento: ${SRI_EMISOR_DIR_ESTABLECIMIENTO:}
      establecimiento: ${SRI_EMISOR_ESTAB:001}
      punto-emision: ${SRI_EMISOR_PTO:001}
      obligado-contabilidad: ${SRI_EMISOR_OBLIGADO_CONTABILIDAD:SI}
