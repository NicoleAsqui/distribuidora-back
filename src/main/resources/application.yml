server:
  port: ${PORT:8080}

spring:
  application:
    name: distribuidora-back
  servlet:
    multipart:
      max-file-size: 18MB
      max-request-size: 20MB
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 180000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    token-secret: ${ADMIN_TOKEN_SECRET:distribuidora-dev-secret-change-me}
    token-ttl-seconds: ${ADMIN_TOKEN_TTL_SECONDS:86400}
  gcs:
    bucket-name: ${GCS_BUCKET_NAME:}
    upload-prefix: ${GCS_UPLOAD_PREFIX:products}
    public-base-url: ${GCS_PUBLIC_BASE_URL:}
    cache-control: ${GCS_UPLOAD_CACHE_CONTROL:public, max-age=31536000, immutable}
